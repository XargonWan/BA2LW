name: Build and Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Unity
      uses: game-ci/unity-setup@v1
      with:
        unityVersion: 6000.0.48f1

    - name: Build for Windows
      uses: game-ci/unity-builder@v4
      with:
        unityVersion: 6000.0.48f1
        targetPlatform: StandaloneWindows64
        buildName: BA2LW_Windows
        buildsPath: Builds/Windows
        projectPath: .

    - name: Build for Linux
      uses: game-ci/unity-builder@v4
      with:
        unityVersion: 6000.0.48f1
        targetPlatform: StandaloneLinux64
        buildName: BA2LW_Linux
        buildsPath: Builds/Linux
        projectPath: .

    - name: Zip Windows build
      run: |
        cd Builds/Windows
        zip -r ../../BA2LW_Windows.zip .

    - name: Zip Linux build
      run: |
        cd Builds/Linux
        zip -r ../../BA2LW_Linux.zip .

    - name: Create Release
      id: create_release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Windows Release Asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./BA2LW_Windows.zip
        asset_name: BA2LW_Windows.zip
        asset_content_type: application/zip

    - name: Upload Linux Release Asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./BA2LW_Linux.zip
        asset_name: BA2LW_Linux.zip
        asset_content_type: application/zip
